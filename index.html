<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>AI News Summarizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    textarea, select, button {
      transition: all 0.3s ease;
    }

    textarea {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    label {
      display: block;
      margin-top: 24px;
      font-weight: 600;
      color: #34495e;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      font-family: 'Inter', sans-serif;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    button {
      flex: 1;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background-color: #2c3e50;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1a252f;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
        margin: 20px;
      }

      textarea, select, button {
        font-size: 14px;
      }

      .buttons {
        flex-direction: column;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #f0f0f0;
      }

      .container {
        background-color: #2c2c2c;
        box-shadow: 0 8px 20px rgba(255, 255, 255, 0.05);
      }

      textarea, select {
        background-color: #3a3a3a;
        color: #f0f0f0;
        border: 1px solid #555;
      }

      button {
        background-color: #4a90e2;
      }

      button:hover {
        background-color: #357ab8;
      }

      footer {
        color: #aaa;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI News Summarizer</h1>
    <form method="POST" action="summarize.php">
      <textarea name="news_text" rows="12" placeholder="Tempel berita di sini..." required></textarea>

      <label for="mode">Pilih jenis ringkasan:</label>
      <select name="mode" id="mode">
        <option value="3 kalimat">Singkat (3 Kalimat)</option>
        <option value="5 kalimat">Detail (5 Kalimat)</option>
        <option value="bullet points">Bullet Points</option>
      </select>

      <div class="buttons">
        <button type="submit">Ringkas Berita</button>
        <button type="button" onclick="previewSummary()">Preview Ringkasan</button>
      </div>
    </form>
  </div>

  <footer>
    &copy; 2025 AI News Summarizer. Dibuat oleh Ling. Semua hak dilindungi.
  </footer>

  <script>
    function previewSummary() {
      const text = document.querySelector('textarea').value;
      const mode = document.querySelector('select').value;
      if (text.trim()) {
        alert(`Preview Ringkasan (${mode}):\n\n"${text.slice(0, 100)}..."`);
      } else {
        alert("Silakan masukkan teks berita terlebih dahulu.");
      }
    }
  </script>
</body>
</html>
